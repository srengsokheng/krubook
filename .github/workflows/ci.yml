name: CI / Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # to reuse the build of a run that already tested this commit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release to main is a fast-forward to a commit that already passed every check on
  # development. When that run is found (and its build is still kept), the deploy reuses it
  # instead of running the same tests again: the release takes about a minute, not seven.
  already-tested:
    name: Already tested on development?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=development&event=push&status=success&head_sha=${{ github.sha }}" \
            -q '[.workflow_runs[] | select((.created_at | fromdateiso8601) > (now - 6*86400))][0].id // empty' || true)
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$id" ]; then echo "Commit ${GITHUB_SHA::7} passed every check on development (run $id); reusing its build."; else echo "Not tested on development in the last 6 days: running the full checks."; fi

  test:
    name: Typecheck, test and build
    needs: already-tested
    # Always on development and pull requests; on main only when the commit was not tested yet.
    if: ${{ !cancelled() && needs.already-tested.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # Browser tests on a fresh demo database: every page at desktop, tablet, phone and dark mode, plus edit flows.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [already-tested, test]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.already-tested.outputs.run-id != '') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://setecattendance.online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
          # The build from the development run that tested this commit, or from this run.
          run-id: ${{ needs.already-tested.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the release
        run: |
          echo "${GITHUB_SHA::7}" > REVISION
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude data --exclude .claude \
            -e "ssh -i ~/.ssh/deploy_key" ./ "krubook@${{ secrets.DEPLOY_HOST }}:/opt/krubook/app/"
      - name: Install and restart
        run: ssh -i ~/.ssh/deploy_key "krubook@${{ secrets.DEPLOY_HOST }}" 'bash /opt/krubook/app/deploy/deploy.sh'
